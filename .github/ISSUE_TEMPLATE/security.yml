name: Security vulnerability
description: Read private disclosure instructions for potential security issues
title: "[Security]: "
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        Please do not post security vulnerabilities in public issues.

        1. Read `SECURITY.md` for responsible disclosure guidance.
        2. Open a private GitHub Security Advisory draft for this repository.
        3. Include affected version, impact, and reproduction details.

        If this does not involve a security vulnerability, close this and open a standard bug report.
